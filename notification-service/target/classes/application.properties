spring.application.name=notification-service

server.port=8086

spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5433/order_db}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:usuario1}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:pasword1234}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://root:pasword1234@localhost:27017/order_event_store?authSource=admin}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false


spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

spring.kafka.consumer.properties.spring.json.value.default.type=com.notification_service.application.dto.PaymentEventDTO
