# ===================================================================
# APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=order-service
server.port=8082

# ===================================================================
# R2DBC POSTGRESQL (Transactional Data)
# ===================================================================
spring.r2dbc.url=r2dbc:postgresql://localhost:5433/order_db
spring.r2dbc.username=user
spring.r2dbc.password=password
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10

# ===================================================================
# MONGODB (Event Store / Audit Logs) - REQUERIDO
# ===================================================================
spring.data.mongodb.uri=mongodb://${MONGO_USER:admin}:${MONGO_PASS:password}@localhost:27017/${MONGO_DB:order_events}?authSource=admin

# ===================================================================
# KAFKA (Event-Driven Communication) - REQUERIDO
# ===================================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Esto permite que el consumidor sepa qué clase está recibiendo
spring.kafka.producer.properties.spring.json.add.type.headers=true

# ===================================================================
# REACTIVE LOGGING
# ===================================================================
logging.level.org.springframework.data.r2dbc=DEBUG

spring.sql.init.mode=always