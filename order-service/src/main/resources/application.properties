spring.application.name=orderServiceAplication
server.port=8082

spring.r2dbc.url=r2dbc:postgresql://localhost:5433/order_db
spring.r2dbc.username=usuario1
spring.r2dbc.password=pasword1234
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

#spring.data.mongodb.uri=mongodb://root:pasword1234@localhost:27017/order_event_store?authSource=admin

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*


spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# MongoDB para el Event Store de Ordenes
spring.data.mongodb.uri=mongodb://root:pasword1234@localhost:27017/order_event_store?authSource=admin

# Kafka Consumer para la respuesta del pago


spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.order_service.orderServiceAplication.application.dto.PaymentEventDTO

