version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: usuario1
      POSTGRES_PASSWORD: pasword1234
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    restart: always

  mongo:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pasword1234
    ports:
      - "27017:27017"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # TU APLICACIÓN INTEGRADA:
  order-service:
    build: ./order-service
    container_name: order-service-container
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - mongo
      - kafka
    environment:
      # Sobrescribimos localhost por el nombre de los servicios en Docker
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/order_db
      SPRING_DATA_MONGODB_URI: mongodb://root:pasword1234@mongo:27017/order_event_store?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092